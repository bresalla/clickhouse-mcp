---
# Source: mcp-clickhouse/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mcp-clickhouse
  labels:
    app.kubernetes.io/name: mcp-clickhouse
    helm.sh/chart: mcp-clickhouse-0.1.0
    app.kubernetes.io/instance: mcp-clickhouse
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-clickhouse
    app.kubernetes.io/instance: mcp-clickhouse
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
# Source: mcp-clickhouse/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-clickhouse
  labels:
    app.kubernetes.io/name: mcp-clickhouse
    helm.sh/chart: mcp-clickhouse-0.1.0
    app.kubernetes.io/instance: mcp-clickhouse
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-clickhouse
      app.kubernetes.io/instance: mcp-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-clickhouse
        app.kubernetes.io/instance: mcp-clickhouse
    spec:
      containers:
        - name: mcp-clickhouse
          image: "docker-private.repository.itools.radwarecloud.com/anatolyb/mcp-clickhouse:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CLICKHOUSE_HOST
              value: "clickhouse-stg-portal.cloud-ng.net"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_SECURE
              value: "false"
            - name: CLICKHOUSE_VERIFY
              value: "false"
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: access-log-reporter-secret
                  key: DATABASES_TLVQAE2E_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: access-log-reporter-secret
                  key: DATABASES_TLVQAE2E_PASSWORD
            - name: CLICKHOUSE_MCP_AUTH_DISABLED
              value: "true"
            - name: CLICKHOUSE_MCP_SERVER_TRANSPORT
              value: "http"
            - name: CLICKHOUSE_MCP_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_MCP_BIND_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
